<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

    content="Get in touch with Kacper Popek, a software engineering student based in New York City."

  <script src="script.js" defer></script>

</head>

<body class="contact-page">

  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <div class="container header-content">

      <a
        class="logo"
        href="index.html"
        aria-label="Kacper Popek — home"
      >
        <svg
          class="logo-mark"
          viewBox="280 265 735 620"
          aria-hidden="true"
          focusable="false"
        >
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="14"
            stroke-linejoin="miter"
          >
            <path
              d="M388 535V287H304V858H388V570L668 858H783L498 569L653 413H835C925 413 925 552 835 552H692L617 635L735 762V638H843C1039 638 1039 327 843 327H625L388 569"
            />
          </g>
        </svg>

        <span class="logo-name">
          Kacper<br>
          Popek
        </span>
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-links">

          <li>
            <a href="index.html">Home</a>
          </li>

          <li>
            <a href="aboutme.html">About Me</a>
          </li>

          <li>
            <a href="projects.html">Projects</a>
          </li>

          <li>
            <a href="contact.html" aria-current="page">Contact</a>
          </li>

        </ul>
      </nav>

    </div>
  </header>

  <main id="main" class="container">

    <section class="contact-layout" aria-labelledby="contact-title">

      <div class="contact-intro">

        <p class="eyebrow">
          <span class="status-dot" aria-hidden="true"></span>
          CONTACT CHANNEL
        </p>

        <h1 id="contact-title">
          LET’S<br>
          <span>CONNECT.</span>
        </h1>

        <p class="intro-text">
          Have an opportunity, a project idea,
          or a question? Send a message.
        </p>

        <div class="social-links">

          <a
            class="social-link"
            href="https://github.com/Monsyerz"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.01-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.64 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.69.11 2.98.72.78 1.16 1.78 1.16 3.01 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.08v3.11c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"
              />
            </svg>

            GitHub
          </a>

          <a
            class="social-link"
            href="https://www.linkedin.com/in/kacper-popek-b1686b340/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5.2 3a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4ZM3.4 9h3.6v12H3.4V9Zm5.8 0h3.4v1.6h.1A3.9 3.9 0 0 1 16.2 8.7c3.7 0 4.4 2.4 4.4 5.5V21H17v-6c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1V21H9.2V9Z"
              />
            </svg>

            LinkedIn
          </a>

        </div>

        <p class="location">BASED IN NEW YORK CITY</p>

      </div>

      <div class="form-panel">

        <div class="panel-header">
          <span>NEW MESSAGE</span>
          <span aria-hidden="true">[ 01 ]</span>
        </div>

        <form class="contact-form">

          <div class="field">
            <label for="name">01 / YOUR NAME</label>

            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Your name"
              required
            >
          </div>

          <div class="field">
            <label for="email">02 / EMAIL ADDRESS</label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="field">
            <label for="message">03 / YOUR MESSAGE</label>

            <textarea
              id="message"
              name="message"
              placeholder="What would you like to talk about?"
              required
            ></textarea>
          </div>

          <button class="send-button" type="button" disabled>
            SEND MESSAGE
          </button>

        </form>

      </div>

    </section>

  </main>

  <footer class="container footer">
    <p>© 2026 Kacper Popek</p>
    <a href="index.html">Back to portfolio</a>
  </footer>

</body>

</html>
